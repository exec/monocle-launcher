name: Launcher bug
description: Report a Monocle Launcher or bot-control issue.
body:
  - type: input
    id: version
    attributes:
      label: Launcher and client versions
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove API tokens, crew keys, account credentials and other private information.
      render: text
