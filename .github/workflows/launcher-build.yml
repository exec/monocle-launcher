name: Monocle Launcher build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install workspace
        shell: bash
        run: |
          npm install --global pnpm@10.33.2
          cp packages/app-lib/.env.prod packages/app-lib/.env
          pnpm install --frozen-lockfile
      - name: Check launcher isolation and repository
        run: |
          node apps/app/monocle-check.mjs
          node apps/app-frontend/src/helpers/bot-operations.check.mjs
          node apps/app-frontend/src/helpers/bot-sessions.check.mjs
      - name: Build frontend
        run: pnpm --filter @modrinth/app-frontend exec vite build --logLevel error
      - name: Build unsigned development installer
        shell: bash
        working-directory: apps/app
        run: pnpm exec tauri build --debug --bundles '${{ matrix.bundles }}' --config '{"build":{"beforeBuildCommand":""}}'
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monocle-launcher-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/debug/bundle/deb/*.deb
            target/debug/bundle/nsis/*.exe
            target/debug/bundle/dmg/*.dmg
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git archive --format=tar.gz --output=monocle-launcher-source.tar.gz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monocle-launcher-corresponding-source
          path: monocle-launcher-source.tar.gz
